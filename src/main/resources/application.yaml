server:
  port: 8080
  error:
    include-stacktrace: never

spring:
  application:
    name: system-rh

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/recursosHumanos_db?createDatabaseIfNotExist=true
    username: ${DB_USER_SQL}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# --- FLYWAY ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true


# --- LOGGING ----
logging:
  level:
    root: INFO
    com.systemapi.rrhh: DEBUG
