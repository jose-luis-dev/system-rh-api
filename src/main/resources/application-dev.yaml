spring:

  jpa:
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      INDENT_OUTPUT: true

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/recursos_humanos_db?createDatabaseIfNotExist=true

# --- LOGGING ----
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
    org.springframework.web.cors: DEBUG